services:
  backup:
    image:  ghcr.io/koopycat/docker-simplebackup:master@sha256:4c548df82e84f077f5d2abdd32b9abdffc1de7ffd077fc058a6853c074959d78
    volumes:
      - "backup:/backups"
      - "config:/backup-script/config"
      - "ssh:/ssh"
    restart: "no"
    command: ["echo", "Backup container is scheduled by Ofelia and will not run continuously"]
    
  # Ofelia scheduler container
  ofelia:
    image: mcuadros/ofelia:latest@sha256:efcbe2c5cf658a25de6443c1462d653f9cc03791d642e01fc6c638a00f97e492
    depends_on:
      - backup
    command: daemon --docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: always
    labels:
      # Run backup daily at 2 AM
      ofelia.job-run.backup.schedule: "0 0 2 * * *"
      ofelia.job-run.backup.container: "server_backup"
      ofelia.job-run.backup.command: "backup"
volumes:
  config:
    external: true
    name: server_backup_config
  ssh:
    external: true
    name: server_backup_ssh
  backup:
    name: server_backup
    external: true

