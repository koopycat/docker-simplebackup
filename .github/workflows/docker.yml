name: Build Docker Image

on:
  # This is a basic workflow that is manually triggered
  workflow_dispatch:
  push:
    branches:
      - master  # Adjust this to your default branch

env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: ${{ github.ref }}-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # The repository's default GITHUB_TOKEN is read-only; pushing to GHCR needs packages: write
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        platform: [x86_64]  # Add more platforms if needed

    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        
      - name: Login to Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract Docker metadata
        id: docker_meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          build-args: |
            CACHEBUST=${{ steps.docker_meta.outputs.build_date }}
          push: true
          platforms: ${{ matrix.platform }}  # ARM architecture
          cache-from: type=gha
          cache-to: type=gha,mode=max
